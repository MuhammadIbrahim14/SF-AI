<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SkillForge Portfolio</title>
  <style>
    :root{--bg:#070a12;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--text:#f8fafc;--muted:#aab7cf;--blue:#06b6d4;--violet:#7c3aed;--green:#22c55e;--max:1160px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,rgba(124,58,237,.32),transparent 34rem),radial-gradient(circle at top right,rgba(6,182,212,.22),transparent 32rem),linear-gradient(180deg,#070a12,#0b1020 52%,#070a12);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    a{color:inherit}.nav{position:sticky;top:0;z-index:20;background:rgba(7,10,18,.72);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}.navin{width:min(var(--max),calc(100% - 32px));min-height:70px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900}.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--blue));display:grid;place-items:center}.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.links a{text-decoration:none;color:var(--muted);font-weight:800;font-size:14px;padding:9px 11px;border-radius:999px}.links a:hover{background:rgba(255,255,255,.08);color:white}
    .hero{width:min(var(--max),calc(100% - 32px));margin:auto;padding:70px 0 34px;display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center}.tagrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tag,.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13px;color:#dbeafe}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(34,197,94,.13)}.eyebrow{margin:0 0 10px;color:#93c5fd;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:950}h1{margin:0;font-size:clamp(42px,7vw,84px);line-height:.93;letter-spacing:-.075em}.grad{background:linear-gradient(135deg,#fff,#c4b5fd 45%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.headline{margin:20px 0 0;color:#cbd5e1;font-size:clamp(18px,2vw,23px);line-height:1.65;max-width:720px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:15px;text-decoration:none;font-weight:900;border:1px solid transparent}.primary{background:white;color:#07111f}.secondary{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16)}
    .profile{border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 90px rgba(0,0,0,.34);padding:24px}.profiletop{display:flex;gap:17px;align-items:center}.avatar{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,var(--violet),var(--blue));display:grid;place-items:center;font-size:48px;font-weight:950;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.pname{margin:0;font-size:25px;line-height:1.12;letter-spacing:-.04em}.prole{margin:8px 0 0;color:var(--muted);font-weight:750}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}.stat{padding:16px;border-radius:18px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12)}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px;font-weight:800}
    .section{width:min(var(--max),calc(100% - 32px));margin:auto;padding:46px 0}.kicker{margin:0 0 8px;color:#67e8f9;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:950}.section h2{margin:0;font-size:clamp(30px,4vw,48px);letter-spacing:-.06em}.sub{margin:8px 0 0;color:var(--muted);line-height:1.65;max-width:700px}.about{margin-top:22px;padding:28px;border-radius:24px;background:var(--card);border:1px solid var(--line);color:#d6deec;line-height:1.85;font-size:17px}.cloud{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill.green{color:#bbf7d0;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.22)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:22px}.card{grid-column:span 6;padding:22px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.16)}.card h3{margin:0 0 10px;font-size:20px}.card p{margin:0;color:var(--muted);line-height:1.65}.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.empty{margin-top:22px;padding:22px;border-radius:22px;border:1px dashed rgba(255,255,255,.18);color:var(--muted);background:rgba(255,255,255,.045)}
    .process .card{grid-column:span 4}.num{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff,#67e8f9);color:#07111f;display:grid;place-items:center;font-weight:950;margin-bottom:15px}.contact{border-radius:32px;padding:30px;background:radial-gradient(circle at top right,rgba(6,182,212,.22),transparent 22rem),linear-gradient(135deg,rgba(124,58,237,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.2);display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.contact p{color:var(--muted);line-height:1.65}.footer{width:min(var(--max),calc(100% - 32px));margin:auto;padding:30px 0 44px;color:#7f8da8;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08)}
    .state{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.statecard{width:min(680px,100%);padding:34px;text-align:center;border-radius:32px;background:var(--card);border:1px solid var(--line);box-shadow:0 24px 90px rgba(0,0,0,.34)}.statecard h1{font-size:clamp(32px,6vw,58px)}.statecard p{color:var(--muted);line-height:1.65}.statecard code{display:inline-block;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.09);color:#bfdbfe;overflow-wrap:anywhere}
    @media(max-width:930px){.hero{grid-template-columns:1fr}.profile{max-width:650px}.process .card,.card{grid-column:span 12}.contact{grid-template-columns:1fr}}@media(max-width:650px){.navin{align-items:flex-start;flex-direction:column;padding:14px 0}.links{justify-content:flex-start}.profiletop{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.avatar{width:100px;height:100px}}
  </style>
</head>
<body>
  <div id="app"><main class="state"><section class="statecard"><h1>SkillForge Portfolio</h1><p>Loading public profile...</p></section></main></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script>
    console.log("SkillForge professional single-file portfolio loaded");

    const firebaseConfig = {
      apiKey: "AIzaSyDIfMqnTP59FUvsyI21CbnQ7jFQqrHqy9U",
      authDomain: "skillforge-ai-4f2da.firebaseapp.com",
      projectId: "skillforge-ai-4f2da",
      // storageBucket: "skillforge-ai-4f2da.appspot.com",
      // messagingSenderId: "PASTE_YOUR_SENDER_ID",
      // appId: "PASTE_YOUR_APP_ID"
    };

    const root = document.getElementById("app");
    const esc = (v) => String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const render = (m) => root.innerHTML = m;

    function slug() {
      const q = new URLSearchParams(location.search).get("slug");
      if (q && q.trim()) return q.trim();
      const p = location.pathname.split("/").filter(Boolean);
      if (p[0] === "p" && p[1]) return decodeURIComponent(p[1]);
      if (p[0] && p[0] !== "p") return decodeURIComponent(p[0]);
      return "";
    }

    function list(v) {
      if (!v) return [];
      if (Array.isArray(v)) return v.map(x => typeof x === "string" ? x : (x.name || x.title || x.skillName || x.label || "")).filter(Boolean);
      if (typeof v === "string") return v.split(",").map(x => x.trim()).filter(Boolean);
      return [];
    }

    function cards(v) {
      if (!Array.isArray(v)) return [];
      return v.map(x => {
        if (typeof x === "string") return {title:x, description:"", link:"", tags:[]};
        return {
          title: x.title || x.name || x.serviceTitle || x.courseTitle || x.projectTitle || "Untitled",
          description: x.description || x.summary || x.bio || x.shortDescription || "",
          link: x.link || x.url || x.projectUrl || x.liveUrl || "",
          tags: list(x.tags || x.skills || x.techStack || x.technologies)
        };
      });
    }

    function pick(d, keys, fallback="") {
      for (const k of keys) if (d[k] !== undefined && d[k] !== null && String(d[k]).trim() !== "") return d[k];
      return fallback;
    }

    function state(title, msg, code="") {
      render(`<main class="state"><section class="statecard"><h1>${esc(title)}</h1><p>${esc(msg)}</p>${code ? `<code>${esc(code)}</code>` : ""}</section></main>`);
    }

    function skillCloud(items, variant="") {
      return items.length ? `<div class="cloud">${items.map(i => `<span class="pill ${variant}">${esc(i)}</span>`).join("")}</div>` : "";
    }

    function sectionCards(title,kicker,subtitle,items,empty) {
      if (!items.length) return `<section class="section"><p class="kicker">${esc(kicker)}</p><h2>${esc(title)}</h2><p class="sub">${esc(subtitle)}</p><div class="empty">${esc(empty || "No public items added yet.")}</div></section>`;
      return `<section class="section"><p class="kicker">${esc(kicker)}</p><h2>${esc(title)}</h2><p class="sub">${esc(subtitle)}</p><div class="grid">${items.map(item => `<article class="card"><h3>${esc(item.title)}</h3>${item.description ? `<p>${esc(item.description)}</p>` : ""}${item.tags?.length ? `<div class="foot">${item.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>` : ""}${item.link ? `<div class="foot"><a class="pill green" href="${esc(item.link)}" target="_blank" rel="noopener">Open Link</a></div>` : ""}</article>`).join("")}</div></section>`;
    }

    function profile(d, s) {
      const name = pick(d, ["displayName","name","fullName"], "SkillForge Freelancer");
      const headline = pick(d, ["headline","title"], "Verified freelancer delivering practical, reliable digital solutions.");
      const bio = pick(d, ["bio","about","summary"], "I help clients turn ideas into polished digital products with clean execution, clear communication, and reliable delivery.");
      const role = pick(d, ["roleType","role"], "Freelancer");
      const avatar = pick(d, ["avatarUrl","photoUrl","profileImageUrl"], "");
      const locationText = pick(d, ["location","city","country"], "");
      const availability = pick(d, ["availability","availabilityStatus"], "Available for selected projects");
      const contactMode = pick(d, ["contactMode"], "Contact through SkillForge");
      const hireEnabled = d.hireButtonEnabled !== false;

      const verifiedSkills = list(d.verifiedSkills);
      const skills = list(d.skills);
      const primarySkills = verifiedSkills.length ? verifiedSkills : skills;
      const services = cards(d.services);
      const projects = cards(d.projects || d.portfolioProjects);
      const certificates = cards(d.certificates);
      const courses = cards(d.coursesCreated || d.courses);
      const reviews = cards(d.reviews || d.testimonials);
      const socialLinks = Array.isArray(d.socialLinks) ? d.socialLinks : [];

      render(`
        <nav class="nav"><div class="navin"><a class="brand" href="#"><span class="logo">SF</span><span>SkillForge Portfolio</span></a><div class="links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#services">Services</a><a href="#projects">Projects</a><a href="#contact">Contact</a></div></div></nav>
        <main>
          <section class="hero">
            <div>
              <div class="tagrow"><span class="tag"><span class="dot"></span>${esc(availability)}</span><span class="tag">${esc(role)}</span><span class="tag">/p/${esc(s)}</span></div>
              <p class="eyebrow">Verified SkillForge Talent</p>
              <h1><span class="grad">${esc(name)}</span></h1>
              <p class="headline">${esc(headline)}</p>
              <div class="actions">${hireEnabled ? `<a class="btn primary" href="#contact">Start a conversation</a>` : ""}<a class="btn secondary" href="#projects">View portfolio work</a></div>
            </div>
            <aside class="profile">
              <div class="profiletop"><div class="avatar">${avatar ? `<img src="${esc(avatar)}" alt="${esc(name)}">` : `<span>${esc(name.charAt(0).toUpperCase())}</span>`}</div><div><h2 class="pname">${esc(name)}</h2><p class="prole">${esc(headline)}</p><div class="tagrow">${locationText ? `<span class="pill">${esc(locationText)}</span>` : ""}<span class="pill green">Public Profile</span></div></div></div>
              <div class="stats"><div class="stat"><strong>${primarySkills.length}</strong><span>Public Skills</span></div><div class="stat"><strong>${projects.length}</strong><span>Projects</span></div><div class="stat"><strong>${services.length}</strong><span>Services</span></div><div class="stat"><strong>${certificates.length}</strong><span>Certificates</span></div></div>
            </aside>
          </section>

          <section id="about" class="section"><p class="kicker">About</p><h2>Professional summary</h2><div class="about">${esc(bio)}</div></section>
          <section id="skills" class="section"><p class="kicker">Capability</p><h2>Verified skills</h2><p class="sub">Only safe public skills are shown. Private earnings, AI chats, wallet data, and internal scores are never exposed.</p>${primarySkills.length ? skillCloud(primarySkills,"green") : `<div class="empty">No public skills added yet.</div>`}</section>

          ${sectionCards("Services","Freelance","Service offerings available through SkillForge.",services,"No public services added yet.")}
          ${sectionCards("Projects","Portfolio","Selected work and proof of execution.",projects,"No public projects added yet.")}
          ${certificates.length ? sectionCards("Certificates","Credibility","Public certificates and achievements.",certificates) : ""}
          ${courses.length ? sectionCards("Courses","Teaching","Courses created or taught by this profile.",courses) : ""}
          ${reviews.length ? sectionCards("Testimonials","Trust","Public reviews or testimonials.",reviews) : ""}

          <section class="section process"><p class="kicker">Process</p><h2>How I work</h2><p class="sub">A clear delivery process keeps projects focused, transparent, and easy to review.</p><div class="grid">
            <article class="card"><div class="num">01</div><h3>Understand the goal</h3><p>I clarify requirements, success criteria, timeline, and expected deliverables before starting.</p></article>
            <article class="card"><div class="num">02</div><h3>Build with clarity</h3><p>I work in structured milestones and keep communication simple, honest, and progress-focused.</p></article>
            <article class="card"><div class="num">03</div><h3>Deliver professionally</h3><p>I provide clean handover notes, review points, and support for final delivery acceptance.</p></article>
          </div></section>

          <section id="contact" class="section"><div class="contact"><div><p class="kicker">Contact</p><h2>Ready to discuss a project?</h2><p>${esc(contactMode)}. Use SkillForge to review services, send requirements, and keep work safely managed.</p>${socialLinks.length ? `<div class="foot">${socialLinks.map(l => { const label=l.label||l.title||l.platform||"Link"; const url=l.url||l.href||""; return url ? `<a class="pill" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : "";}).join("")}</div>` : ""}</div>${hireEnabled ? `<a class="btn primary" href="#">Hire through SkillForge</a>` : `<span class="pill">Hire disabled</span>`}</div></section>
        </main>
        <footer class="footer"><span>Powered by SkillForge AI</span><span>Safe public profile • No private earnings shown</span></footer>
      `);
    }

    async function main() {
      const s = slug();
      console.log("Resolved slug:", s);

      if (!s) { state("Portfolio slug is missing", "Open a portfolio link like /p/your-slug."); return; }
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("PASTE_")) { state("Firebase config required", "Paste your Firebase Web config inside this index.html before deploying."); return; }
      if (!window.firebase?.initializeApp || !window.firebase?.firestore) { state("Firebase SDK failed to load", "Check your internet connection and Firebase CDN scripts."); return; }

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      console.log("Reading Firestore path:", "publicProfiles/" + s);
      const snap = await db.collection("publicProfiles").doc(s).get();
      console.log("Doc exists:", snap.exists);

      if (!snap.exists) { state("Portfolio not found", "No public profile exists for this slug.", "publicProfiles/" + s); return; }

      const data = snap.data() || {};
      console.log("Profile data:", data);
      const visible = data.publicVisible === true || data.isPublic === true;
      console.log("Visibility:", { publicVisible: data.publicVisible, isPublic: data.isPublic, visible });

      if (!visible) { state("This portfolio is private", "The owner has not published this portfolio yet."); return; }
      profile(data, s);
    }

    main().catch(err => {
      console.error("Portfolio load failed:", err);
      state("Portfolio failed to load", err.message || String(err));
    });
  </script>
</body>
</html>
