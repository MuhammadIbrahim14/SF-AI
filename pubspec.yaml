name: skillforge_ai
description: "SkillForge AI — Multi-role ecosystem platform for Students, Teachers, Freelancers, and Companies."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.4.1

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.3

  # UI
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1

  # Utilities
  http: ^1.6.0
  intl: ^0.20.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  local_auth: ^3.0.1
  pdf: ^3.13.0
  printing: ^5.15.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  # Spatial Interaction Engine (Student Module Phase 1)
  skillforge_sie:
    path: packages/skillforge_sie


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
